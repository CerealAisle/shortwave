# Copy to /etc/cloudflared/config.yml after creating a named tunnel, then
# replace <TUNNEL-UUID> and the hostname. See DEPLOY.md, "Expose the callback
# URL".
#
# The credentials JSON is written to ~/.cloudflared/<TUNNEL-UUID>.json by
# `cloudflared tunnel create`. Copy it to /etc/cloudflared/ so the systemd
# service (which runs as root) can read it from a fixed path.

tunnel: shortwave
credentials-file: /etc/cloudflared/<TUNNEL-UUID>.json

ingress:
  # --- production, /opt/lovense-bot on :4000 --------------------------------
  - hostname: lovense.example.com
    path: ^/lovense/callback$
    service: http://127.0.0.1:4000

  # --- staging, /opt/lovense-bot-staging on :4001 ---------------------------
  # Both routes stay configured permanently. Only ONE of them is ever named
  # in the Lovense dashboard at a time, because Lovense allows a single
  # callback URL per developer account — so switching which instance receives
  # callbacks is a one-field edit there, with nothing to change on this host.
  # Harmless to leave in place if you never run staging.
  - hostname: lovense.example.com
    path: ^/staging/callback$
    service: http://127.0.0.1:4001

  # Health check, handy for confirming the tunnel reaches the bot.
  - hostname: lovense.example.com
    path: ^/healthz$
    service: http://127.0.0.1:4000

  # Required catch-all.
  - service: http_status:404
